name: Windows sürümü

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: MimarNot-Windows
          path: |
            release/*.exe
      - name: Sürüm numarasını oku
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Sürüm sayfasına ekle (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Mimar Not ${{ steps.ver.outputs.v }}
          body: |
            Windows için Mimar Not.
            - **MimarNot-Kurulum-*.exe**: kurulum dosyası (masaüstü ve Başlat menüsü kısayolu)
            - **MimarNot-Tasinabilir-*.exe**: kurulum gerektirmeden çalışır
            İlk açılışta Ayarlar'dan Claude API anahtarını girin. Uygulama imzasız olduğu için Windows uyarı verirse "Ek bilgi" → "Yine de çalıştır".
          files: release/*.exe
