# Planhane Bulut, kendi sunucunuzda (VPS). Kolay yol: deploy/install.sh (her şeyi sorarak kurar).
# Elle: deploy/.env dosyasını doldurun (cloud/.env.example + DOMAIN=...) ve
#   80/443 boşsa:            docker compose --profile caddy up -d --build   (HTTPS otomatik)
#   başka web sunucusu varsa: docker compose up -d --build                   (127.0.0.1:APP_PORT, nginx'ten yönlendirin)
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${APP_PORT:-8737}:8080"
    volumes:
      - mimarnot-data:/data
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlı olmalı, ör. planhane.com.tr}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  mimarnot-data:
  caddy-data:
