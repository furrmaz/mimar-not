# Kendi sunucunuzda (VPS) çalıştırmak için: alan adınızın DNS kaydını sunucuya yönlendirin,
# deploy/.env dosyasını doldurun (cloud/.env.example'a bakın) ve:  docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - mimarnot-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlı olmalı, ör. mimarnot.com.tr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  mimarnot-data:
  caddy-data:
