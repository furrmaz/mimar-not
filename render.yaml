# Render.com Blueprint: Dashboard → New → Blueprint → bu depoyu seçin. Gizli değerleri Render panelinden girin.
services:
  - type: web
    name: mimar-not
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
      - key: PAY_BANK
        sync: false
      - key: PAY_HOLDER
        sync: false
      - key: PAY_IBAN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_WHATSAPP
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
